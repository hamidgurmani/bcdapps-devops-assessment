services:
  postgres:
    image: postgres:16-alpine
    container_name: rideflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rideflow}
      POSTGRES_USER: ${POSTGRES_USER:-rideflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rideflow} -d ${POSTGRES_DB:-rideflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rideflow

  redis:
    image: redis:7-alpine
    container_name: rideflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rideflow

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    image: rideflow-backend:1.0.0
    container_name: rideflow-backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rideflow
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    image: rideflow-frontend:1.0.0
    container_name: rideflow-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rideflow

volumes:
  postgres_data:
  redis_data:

networks:
  rideflow:
    driver: bridge

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideflow-frontend
  labels:
    app.kubernetes.io/name: rideflow-frontend
    app.kubernetes.io/part-of: rideflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rideflow-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rideflow-frontend
        app.kubernetes.io/part-of: rideflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: rideflow-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

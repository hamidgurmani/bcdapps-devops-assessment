apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideflow-backend
  labels:
    app.kubernetes.io/name: rideflow-backend
    app.kubernetes.io/part-of: rideflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rideflow-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rideflow-backend
        app.kubernetes.io/part-of: rideflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: rideflow-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: rideflow-config
                  key: APP_NAME
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: rideflow-config
                  key: APP_ENV
            - name: API_V1_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: rideflow-config
                  key: API_V1_PREFIX
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: rideflow-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rideflow-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rideflow-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

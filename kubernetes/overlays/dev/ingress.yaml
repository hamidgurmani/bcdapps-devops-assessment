apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rideflow-ingress
  namespace: rideflow-dev
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rideflow-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rideflow-frontend
                port:
                  number: 3000

name: RideFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rideflow_test
          POSTGRES_USER: rideflow
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rideflow -d rideflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://rideflow:ci_postgres_password@localhost:5432/rideflow_test
      REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -v

  frontend-ci:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
        run: npm run build

  publish-images:
    name: Scan and Publish Images
    needs:
      - backend-ci
      - frontend-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image owner
        id: vars
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker buildx build --load \
            -f docker/backend.Dockerfile \
            -t ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-backend:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker buildx build --load \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 \
            -f docker/frontend.Dockerfile \
            -t ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-frontend:${{ github.sha }} \
            .

      - name: Scan backend image
        id: scan_backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-backend:${{ github.sha }}
          format: json
          output: trivy-backend.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          vuln-type: os,library

      - name: Scan frontend image
        id: scan_frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-frontend:${{ github.sha }}
          format: json
          output: trivy-frontend.json
          severity: HIGH,CRITICAL
          exit-code: '0'
          vuln-type: os,library

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-backend.json
            trivy-frontend.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check backend critical vulnerabilities
        id: gate_backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-backend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          vuln-type: os,library

      - name: Check frontend critical vulnerabilities
        id: gate_frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          vuln-type: os,library

      - name: Enforce vulnerability gate
        if: steps.gate_backend.outcome == 'failure' || steps.gate_frontend.outcome == 'failure'
        run: |
          echo "Critical vulnerabilities detected. Images will not be published."
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        run: |
          IMAGE=ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-backend
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Publish frontend image
        run: |
          IMAGE=ghcr.io/${{ steps.vars.outputs.owner }}/rideflow-frontend
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
